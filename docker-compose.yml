services:
  cooking-helper:
    build: .
    image: cooking-helper
    container_name: cooking-helper
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Passed through from the host environment; never hardcode the key here.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - cooking-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  cooking-data:
